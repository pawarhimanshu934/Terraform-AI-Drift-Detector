[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-ai-drift-detector"
version = "0.1.0"
description = "Cloud-agnostic Terraform state drift detection without plan/apply operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
drift-detector = "drift_detector.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
